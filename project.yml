name: AppTemplate
options:
  bundleIdPrefix: com.nimbuswebdesign
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
fileGroups:
  - AppTemplate.storekit
  - README.md
targets:
  AppTemplate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTemplate
    info:
      path: AppTemplate/Info.plist
      properties:
        CFBundleDisplayName: AppTemplate
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimbuswebdesign.apptemplate
        PRODUCT_NAME: AppTemplate
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  AppTemplateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTemplateTests
    dependencies:
      - target: AppTemplate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimbuswebdesign.apptemplate.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
schemes:
  AppTemplate:
    build:
      targets:
        AppTemplate: all
        AppTemplateTests: [test]
    run:
      config: Debug
      storeKitConfiguration: AppTemplate.storekit
    test:
      config: Debug
      targets:
        - AppTemplateTests
    archive:
      config: Release
